name: Bug 反馈
description: 报告一个 Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue。**严禁粘贴豆包 Cookie 或 `data/` 下任何文件内容。**

  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动服务 npm start
        2. 访问 ...
        3. 出现 ...
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        Node: v20.x
        OS: Windows 11 / Android Termux
        FFmpeg: 6.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 贴出 logs/ 中的报错片段（先删掉敏感信息）。
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - TTS 合成
        - Cookie 管理 / 登录
        - 阅读 APP 集成
        - 预制书 / 书籍缓存
        - WebUI
        - 打包脚本
        - 其他
    validations:
      required: true
