name: 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述痛点或场景，而不是直接描述方案。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - TTS 合成
        - Cookie 管理 / 登录
        - 阅读 APP 集成
        - 预制书 / 书籍缓存
        - WebUI
        - 打包脚本
        - 文档
        - 其他
    validations:
      required: true
